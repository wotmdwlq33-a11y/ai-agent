name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          # 파일 잠금(msvcrt) 등 Windows 경로 확인용
          - os: windows-latest
            python-version: "3.13"
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: ruff (lint)
        run: python -m ruff check .
      - name: ruff (format)
        run: python -m ruff format --check .
      - name: mypy
        run: python -m mypy
      - name: pytest
        run: python -m pytest -q --cov=jev --cov-report=term-missing
